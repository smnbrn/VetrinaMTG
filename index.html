<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vetrina — Magic: The Gathering</title>

<!-- Icona integrata tramite Data URI (nessun file esterno richiesto) -->
<link rel="apple-touch-icon" href="icon.png">

<style>
  /* Layout: una sola carta centrata a tutto schermo; ricerca e artwork sono livelli sopra. */
  :root {
    --bg: #08090c;
    --bg-soft: #12141c;
    --ink: #f0eee6;
    --muted: #8b8e9a;
    --accent: #dfb564;
    --shadow: rgba(0, 0, 0, .75);
    --radius-card: 4.75%;
    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  @property --glow1 { syntax: '<color>'; inherits: true; initial-value: rgba(223,181,100,.08); }
  @property --glow2 { syntax: '<color>'; inherits: true; initial-value: rgba(223,181,100,.08); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: --glow1 .9s ease, --glow2 .9s ease;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle 600px at 50% 45%, var(--glow1), transparent 75%),
      radial-gradient(ellipse 70% 70% at 50% 50%, var(--glow2), transparent 80%);
    z-index: 0;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .032;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    z-index: 1;
  }

  #stage {
    position: fixed; inset: 0; z-index: 2;
    display: grid; place-items: center;
    padding: max(2vh, env(safe-area-inset-top, 0px)) max(2vw, env(safe-area-inset-right, 0px)) max(2vh, env(safe-area-inset-bottom, 0px)) max(2vw, env(safe-area-inset-left, 0px));
    perspective: 1200px;
  }
  #wrap {
    --rx: 0deg; --ry: 0deg;
    height: min(92vh, calc(92vw * 680 / 488));
    aspect-ratio: 488 / 680;
    position: relative;
    perspective: 1100px;
    transform-style: preserve-3d;
  }
  #wrap.loading::after {
    content: ""; position: absolute; inset: 0;
    border-radius: var(--radius-card);
    background: linear-gradient(110deg, var(--bg-soft) 30%, #1a1e28 50%, var(--bg-soft) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.2s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  #cardBtn {
    all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in;
    position: relative; border-radius: var(--radius-card);
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d;
    transition: transform .18s cubic-bezier(.25, .46, .45, .94);
  }
  #cardBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  
  #card {
    display: block; width: 100%; height: 100%; object-fit: contain;
    border-radius: var(--radius-card);
    filter: drop-shadow(calc(var(--ry) * -0.8px) calc(var(--rx) * 1.2px + 28px) 45px var(--shadow));
    transition: opacity .25s ease, filter .2s ease;
    user-select: none; -webkit-user-drag: none;
  }
  #wrap.loading #card { opacity: 0; }

  #glare {
    position: absolute; inset: 0; border-radius: var(--radius-card);
    pointer-events: none; overflow: hidden;
    opacity: var(--go, 0); transition: opacity .35s ease;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%),
      rgba(255,255,255,.4), rgba(255,255,255,.12) 25%, transparent 55%);
    mix-blend-mode: overlay;
  }
  #wrap.holo #glare::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(125deg,
      transparent 15%, rgba(255,50,150,.45) 32%, rgba(255,220,50,.45) 42%,
      rgba(50,255,180,.45) 52%, rgba(50,170,255,.45) 62%, rgba(200,90,255,.45) 75%, transparent 88%);
    background-size: 260% 260%;
    background-position: var(--gx, 50%) var(--gy, 50%);
    mix-blend-mode: color-dodge; opacity: .3;
  }
  #wrap.loading #glare { opacity: 0; }

  #wrap.landscape {
    height: auto;
    width: min(92vw, calc(92vh * 680 / 488));
    aspect-ratio: 680 / 488;
  }
  #wrap.landscape #card {
    position: absolute; left: 50%; top: 50%;
    width: calc(100% * 488 / 680); height: calc(100% * 680 / 488);
    transform: translate(-50%, -50%) rotate(90deg);
  }

  .corner {
    position: fixed; z-index: 10;
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(18,20,28,.65); color: var(--ink);
    border: 1px solid rgba(255,255,255,.1);
    cursor: pointer; opacity: .4;
    transition: opacity .2s ease, background .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1), border-color .2s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .corner:hover, .corner:focus-visible { 
    opacity: 1; background: rgba(24,28,38,.9); 
    border-color: rgba(223,181,100,.3);
    transform: scale(1.08);
    outline: none; 
  }
  .corner svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #searchBtn { top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  #backBtn   { top: max(16px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); }
  #flipBtn   { top: calc(max(16px, env(safe-area-inset-top, 0px)) + 58px); left: max(16px, env(safe-area-inset-left, 0px)); }

  #search {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(8,9,12,.9); backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex; flex-direction: column; align-items: center;
    padding: max(6vh, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
    gap: 18px; overflow-y: auto;
  }
  #searchForm { width: min(680px, 100%); }
  #q {
    width: 100%; padding: 14px 18px; font: inherit; font-size: 1.05rem;
    color: var(--ink); background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  #q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(223,181,100,.15); }
  #q::placeholder { color: var(--muted); }
  #hint { margin: 0; min-height: 1.2em; color: var(--muted); font-size: .88rem; }
  #grid {
    width: min(1100px, 100%);
    display: grid; gap: 16px; justify-content: center;
    grid-template-columns: repeat(auto-fill, 150px);
  }
  #grid button {
    all: unset; cursor: pointer; display: block; border-radius: 8%;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), filter .2s ease;
  }
  #grid button:hover, #grid button:focus-visible { transform: translateY(-5px) scale(1.03); filter: brightness(1.1); }
  #grid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #grid button.battle { aspect-ratio: 488 / 680; display: grid; place-items: center; }
  #grid button.battle img { transform: rotate(90deg) scale(.718); }
  #grid img { display: block; width: 100%; aspect-ratio: 488 / 680; object-fit: contain; background: transparent; border-radius: 6px; }

  #art {
    position: fixed; inset: 0; z-index: 40; cursor: zoom-out;
    background: #000; overflow: hidden;
  }
  #artBg {
    position: absolute; inset: -8%;
    background-size: cover; background-position: center;
    filter: blur(42px) brightness(.5) saturate(1.25);
    transform: scale(1.1);
  }
  #artImg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
  }

  #variants {
    position: fixed; z-index: 5;
    left: max(16px, env(safe-area-inset-left, 0px));
    top: calc(max(16px, env(safe-area-inset-top, 0px)) + 116px);
    bottom: max(16px, env(safe-area-inset-bottom, 0px));
    width: 242px;
    display: flex; flex-direction: column; gap: 10px;
    opacity: .6; transition: opacity .25s ease;
  }
  #variants:hover, #variants:focus-within { opacity: 1; }
  #varTitle { margin: 0 0 0 4px; font-size: .78rem; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  #varList {
    display: flex; flex-direction: column; gap: 6px;
    overflow-y: auto; min-height: 0; padding: 2px 6px 2px 2px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent;
  }
  #varList button {
    all: unset; flex: none; cursor: pointer;
    display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 10px;
    padding: 6px; border-radius: 10px; border: 1px solid transparent;
    background: rgba(255,255,255,.02);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  #varList button:hover { background: rgba(255,255,255,.07); transform: translateX(2px); }
  #varList button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #varList button[aria-current="true"] { background: rgba(223,181,100,.12); border-color: rgba(223,181,100,.45); }
  #varList img {
    display: block; width: 84px; aspect-ratio: 626 / 457; object-fit: cover;
    border-radius: 6px; background: var(--bg-soft);
  }
  #varList .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #varList span {
    font-size: .8rem; line-height: 1.25; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;
  }
  #varList small { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; }

  @media (max-width: 980px) {
    #variants {
      top: auto; width: auto; right: max(16px, env(safe-area-inset-right, 0px));
      left: max(16px, env(safe-area-inset-left, 0px));
      opacity: 1; gap: 6px;
    }
    #varList { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 2px 2px 8px; }
    #varList button { grid-template-columns: 1fr; width: 104px; gap: 4px; }
    #varList img { width: 100%; }
    body.has-variants #wrap { height: min(68vh, calc(92vw * 680 / 488)); }
    body.has-variants #stage { padding-bottom: 140px; }
  }

  #msg {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); z-index: 50;
    padding: 10px 18px; border-radius: 10px;
    background: rgba(18,20,28,.95); color: var(--ink);
    border: 1px solid rgba(255,255,255,.12); font-size: .9rem;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    max-width: calc(100vw - 32px);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .corner {
    width: 48px; height: 48px;
    opacity: .68;
    background: rgba(15,17,24,.72);
    border-color: rgba(255,255,255,.13);
    box-shadow: 0 8px 26px rgba(0,0,0,.18);
  }
  .corner:active { transform: scale(.96); }
  #card { backface-visibility: hidden; }
  #search {
    background: rgba(7,8,11,.94);
    gap: 14px;
    padding-top: max(8vh, env(safe-area-inset-top, 0px));
  }
  #searchForm { position: sticky; top: 0; z-index: 2; }
  #q { min-height: 52px; box-shadow: 0 12px 34px rgba(0,0,0,.18); }
  #quickSearch {
    width: min(680px, 100%);
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
    color: var(--muted); font-size: .78rem;
  }
  #quickSearch span { margin-right: 3px; }
  #quickSearch button {
    appearance: none; border: 1px solid rgba(255,255,255,.11); border-radius: 999px;
    padding: 7px 11px; min-height: 34px; color: #d8d6ce; background: rgba(255,255,255,.035);
    font: inherit; cursor: pointer; transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  #quickSearch button:hover, #quickSearch button:focus-visible {
    color: var(--ink); border-color: rgba(223,181,100,.45); background: rgba(223,181,100,.09); outline: none;
  }
  #hint { text-align: center; }
  #grid { gap: 18px; padding: 4px 2px 28px; }
  #grid button { border-radius: 10px; overflow: hidden; }
  #grid img { transition: filter .2s ease; }
  #grid button:hover img { filter: drop-shadow(0 10px 16px rgba(0,0,0,.4)); }
  #varTitle { letter-spacing: .08em; }
  #varList button { background: rgba(18,20,28,.48); backdrop-filter: blur(8px); }
  #varList button[aria-current="true"] { box-shadow: inset 0 0 0 1px rgba(223,181,100,.08); }
  #msg { animation: msg-in .22s ease-out both; }
  @keyframes msg-in { from { opacity: 0; transform: translate(-50%, 7px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (prefers-reduced-motion: reduce) {
    #card, #cardBtn, #glare, body { transition: none; }
    #wrap.loading::after { animation: none; }
    #grid button, #varList button, #variants, .corner { transition: none; }
  }
</style>
</head>
<body>

<main id="stage">
  <div id="wrap" class="loading">
    <button id="cardBtn" type="button" aria-label="Carta">
      <img id="card" alt="" draggable="false">
      <span id="glare" aria-hidden="true"></span>
    </button>
  </div>
</main>

<button id="backBtn" class="corner" type="button" aria-label="Torna ai risultati" title="Torna ai risultati" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
</button>
<section id="variants" hidden aria-label="Varianti di altri artisti">
  <p id="varTitle"></p>
  <div id="varList"></div>
</section>
<button id="flipBtn" class="corner" type="button" aria-label="Gira la carta" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
</button>
<button id="searchBtn" class="corner" type="button" aria-label="Cerca carte">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
</button>

<section id="search" hidden aria-label="Ricerca carte">
  <form id="searchForm" autocomplete="off">
    <input id="q" type="search" placeholder="Nome carta o ricerca Scryfall…" aria-label="Cerca carte" enterkeyhint="search" aria-describedby="searchHelp">
  </form>
  <div id="quickSearch" aria-label="Ricerche di esempio">
    <span id="searchHelp">Prova una ricerca</span>
    <button type="button" data-query="t:dragon c:r">Draghi rossi</button>
    <button type="button" data-query="t:legendary">Leggendarie</button>
    <button type="button" data-query="rarity:mythic">Mitiche</button>
  </div>
  <p id="hint" role="status" aria-live="polite"></p>
  <div id="grid"></div>
</section>

<div id="art" hidden role="dialog" aria-label="Artwork a schermo intero">
  <div id="artBg"></div>
  <img id="artImg" alt="">
</div>

<script>
(() => {
  'use strict';

  const API = 'https://api.scryfall.com';
  const $ = (s) => document.querySelector(s);
  const wrap = $('#wrap'), btn = $('#cardBtn'), img = $('#card');
  const flipBtn = $('#flipBtn'), searchBtn = $('#searchBtn'), backBtn = $('#backBtn');
  const search = $('#search'), form = $('#searchForm'), qEl = $('#q'), hintEl = $('#hint'), grid = $('#grid');
  const art = $('#art'), artImg = $('#artImg'), artBg = $('#artBg');
  const varPanel = $('#variants'), varTitle = $('#varTitle'), varList = $('#varList');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;

  let current = null, face = 0;
  let list = [], index = 0;
  let results = [];
  let showToken = 0, searchToken = 0, debounceId = 0, msgId = 0;
  let artOpen = false, closing = false;
  let variantsToken = 0;
  let varState = null;

  let nextSlot = 0;
  const cache = new Map();
  async function sf(path) {
    if (cache.has(path)) return cache.get(path);
    const wait = Math.max(0, nextSlot - Date.now());
    nextSlot = Date.now() + wait + 100;
    if (wait) await new Promise((r) => setTimeout(r, wait));
    const res = await fetch(API + path, { headers: { Accept: 'application/json;q=0.9,*/*;q=0.8' } });
    if (!res.ok) { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
    const data = await res.json();
    if (!path.startsWith('/cards/random')) cache.set(path, data);
    return data;
  }

  function faces(card) {
    if (card.image_uris) return [card.image_uris];
    return (card.card_faces || []).filter((f) => f.image_uris).map((f) => f.image_uris);
  }
  function isBattleFace(card, i) {
    const f = card.card_faces && card.card_faces[i];
    const t = (f && f.type_line) || card.type_line || '';
    return /\bBattle\b/.test(t);
  }
  const thumbOf = (card) => { const f = faces(card)[0]; return f ? (f.small || f.normal) : ''; };

  function msg(text, ms = 3500) {
    let el = $('#msg');
    if (!el) { el = document.createElement('div'); el.id = 'msg'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = text;
    clearTimeout(msgId);
    msgId = setTimeout(() => el.remove(), ms);
  }

  const FX = {
    next:  { out: [{ translate: '0 0', opacity: 1 }, { translate: '-7% 0', opacity: 0 }], inn: [{ translate: '7% 0', opacity: 0 }, { translate: '0 0', opacity: 1 }] },
    prev:  { out: [{ translate: '0 0', opacity: 1 }, { translate: '7% 0', opacity: 0 }],  inn: [{ translate: '-7% 0', opacity: 0 }, { translate: '0 0', opacity: 1 }] },
    flip:  { out: [{ rotate: 'y 0deg' }, { rotate: 'y 90deg' }], inn: [{ rotate: 'y -90deg' }, { rotate: 'y 0deg' }] },
    fade:  { out: [{ opacity: 1 }, { opacity: 0 }], inn: [{ opacity: 0 }, { opacity: 1 }] },
    down:  { out: [{ translate: '0 0', opacity: 1 }, { translate: '0 -5%', opacity: 0 }], inn: [{ translate: '0 5%', opacity: 0 }, { translate: '0 0', opacity: 1 }] },
    up:    { out: [{ translate: '0 0', opacity: 1 }, { translate: '0 5%', opacity: 0 }],  inn: [{ translate: '0 -5%', opacity: 0 }, { translate: '0 0', opacity: 1 }] },
  };
  const TIMING = {
    next: [170, 280], prev: [170, 280], flip: [160, 240], fade: [130, 240], down: [150, 260], up: [150, 260],
  };
  let fxAnim = null;

  function loadSrc(u) {
    const url = u && (u.png || u.large || u.normal);
    if (!url) return Promise.resolve('');
    return new Promise((resolve) => {
      const probe = new Image();
      probe.onload = () => resolve(url);
      probe.onerror = () => resolve(u.large || u.normal || '');
      probe.src = url;
    });
  }

  const HUES = {
    W: 'rgba(240,225,175,.12)', U: 'rgba(65,130,240,.16)', B: 'rgba(140,95,210,.15)',
    R: 'rgba(235,70,50,.16)', G: 'rgba(50,185,105,.14)',
  };
  const DEFAULT_GLOW = 'rgba(223,181,100,.08)';
  function applyGlow() {
    const f = current.card_faces && current.card_faces[face];
    let cs = (f && f.colors) || current.colors || [];
    if (!cs.length) cs = current.color_identity || [];
    const a = HUES[cs[0]] || DEFAULT_GLOW;
    const b = HUES[cs[cs.length - 1]] || a;
    document.body.style.setProperty('--glow1', a);
    document.body.style.setProperty('--glow2', b);
  }
  const isHolo = (c) => c.rarity === 'mythic' || (Array.isArray(c.finishes) && c.finishes.length > 0 && !c.finishes.includes('nonfoil'));

  async function setFace(mode) {
    const my = ++showToken;
    const u = faces(current)[face];
    applyGlow();
    wrap.classList.toggle('holo', isHolo(current));
    if (fxAnim) { fxAnim.cancel(); fxAnim = null; }
    if (!u) { msg('Immagine non disponibile per questa carta.'); wrap.classList.remove('loading'); return; }

    const animated = mode && FX[mode] && !reduceMotion && typeof btn.animate === 'function';
    if (!animated) {
      wrap.classList.add('loading');
      const src = await loadSrc(u);
      if (my !== showToken) return;
      wrap.classList.toggle('landscape', isBattleFace(current, face));
      img.src = src; wrap.classList.remove('loading');
      return;
    }

    const [tOut, tIn] = TIMING[mode];
    const out = btn.animate(FX[mode].out, { duration: tOut, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
    fxAnim = out;
    const slow = setTimeout(() => { if (my === showToken) wrap.classList.add('loading'); }, 320);
    const [src] = await Promise.all([loadSrc(u), out.finished.catch(() => {})]);
    clearTimeout(slow);
    if (my !== showToken) return;
    wrap.classList.toggle('landscape', isBattleFace(current, face));
    img.src = src;
    try { await img.decode(); } catch (_) {}
    if (my !== showToken) return;
    wrap.classList.remove('loading');
    const inn = btn.animate(FX[mode].inn, { duration: tIn, easing: 'cubic-bezier(.2,.8,.2,1)' });
    out.cancel();
    fxAnim = inn;
    inn.onfinish = () => { if (fxAnim === inn) fxAnim = null; };
  }

  function preload(card) {
    if (!card) return;
    faces(card).forEach((u) => {
      if (u.art_crop) new Image().src = u.art_crop;
    });
  }

  async function show(card, i, mode) {
    current = card; face = 0;
    document.title = (card.name ? card.name + ' — ' : '') + 'Vetrina · Magic';
    if (typeof i === 'number') index = i;
    btn.setAttribute('aria-label', card.name || 'Carta');
    img.alt = card.name || '';
    flipBtn.hidden = faces(card).length < 2;
    try { history.replaceState(null, '', '#' + card.id); } catch (_) {}
    preload(card);
    backBtn.hidden = results.length === 0;
    loadVariants(card, face);
    if (artOpen) updateArt();
    await setFace(mode);
  }

  function nav(d) {
    if (list.length < 2) return;
    index = (index + d + list.length) % list.length;
    show(list[index], index, d > 0 ? 'next' : 'prev');
  }

  function flip() {
    if (!current || faces(current).length < 2) return;
    face = (face + 1) % faces(current).length;
    setFace('flip');
    loadVariants(current, face);
    if (artOpen) updateArt();
  }

  async function loadRandom() {
    try {
      const card = await sf('/cards/random');
      list = [card]; index = 0;
      await show(card, 0);
    } catch (e) { msg('Impossibile contattare Scryfall. Controlla la connessione.'); wrap.classList.remove('loading'); }
  }

  async function loadById(id) {
    try {
      const card = await sf('/cards/' + encodeURIComponent(id));
      list = [card]; index = 0;
      await show(card, 0);
    } catch (e) { loadRandom(); }
  }

  function openSearch() {
    search.hidden = false;
    qEl.focus(); qEl.select();
  }
  function closeSearch() {
    if (search.contains(document.activeElement)) document.activeElement.blur();
    search.hidden = true;
  }

  function renderGrid(cards) {
    grid.textContent = '';
    const frag = document.createDocumentFragment();
    cards.slice(0, 60).forEach((c, i) => {
      const src = thumbOf(c); if (!src) return;
      const b = document.createElement('button');
      b.type = 'button'; b.title = c.name || ''; b.setAttribute('aria-label', c.name || 'Carta');
      if (isBattleFace(c, 0)) b.classList.add('battle');
      const im = document.createElement('img');
      im.src = src; im.alt = ''; im.loading = 'lazy';
      b.appendChild(im);
      b.addEventListener('click', () => pick(i));
      frag.appendChild(b);
    });
    grid.appendChild(frag);
  }

  function pick(i) {
    list = results.slice(0, 60); index = i;
    closeSearch();
    show(list[i], i);
  }

  async function searchCards(q) {
    const base = { unique: 'cards', order: 'name' };
    const attempts = [{ q }];
    if (!/\blang(uage)?:/i.test(q)) {
      attempts.push(
        { q: q + ' lang:it', include_multilingual: 'true' },
        { q: q + ' lang:any', include_multilingual: 'true' }
      );
    }
    let lastErr;
    for (const a of attempts) {
      try { return await sf('/cards/search?' + new URLSearchParams({ ...base, ...a })); }
      catch (e) { if (e.status !== 404) throw e; lastErr = e; }
    }
    throw lastErr;
  }

  async function runSearch(openFirst) {
    const q = qEl.value.trim();
    if (!q) { grid.textContent = ''; hintEl.textContent = ''; return; }
    const my = ++searchToken;
    hintEl.textContent = 'Cerco…';
    try {
      const data = await searchCards(q);
      if (my !== searchToken) return;
      results = data.data || [];
      renderGrid(results);
      hintEl.textContent = data.total_cards > 60 ? `Prime 60 carte su ${data.total_cards}. Restringi la ricerca per vederne altre.` : (data.total_cards === 1 ? '1 carta' : `${data.total_cards} carte`);
      if (openFirst && results.length) pick(0);
    } catch (e) {
      if (my !== searchToken) return;
      grid.textContent = '';
      hintEl.textContent = e.status === 404 ? 'Nessuna carta trovata.' : 'Errore di rete. Riprova.';
    }
  }

  qEl.addEventListener('input', () => { clearTimeout(debounceId); debounceId = setTimeout(() => runSearch(false), 350); });
  form.addEventListener('submit', (e) => { e.preventDefault(); clearTimeout(debounceId); runSearch(true); });
  $('#quickSearch').addEventListener('click', (e) => {
    const chip = e.target.closest('button[data-query]');
    if (!chip) return;
    qEl.value = chip.dataset.query;
    clearTimeout(debounceId);
    runSearch(false);
    qEl.focus();
  });
  search.addEventListener('click', (e) => { if (e.target === search) closeSearch(); });
  searchBtn.addEventListener('click', openSearch);
  flipBtn.addEventListener('click', flip);
  backBtn.addEventListener('click', openSearch);

  const inset = (r, round) => {
    const vw = innerWidth, vh = innerHeight;
    return `inset(${Math.max(0, r.top)}px ${Math.max(0, vw - r.right)}px ${Math.max(0, vh - r.bottom)}px ${Math.max(0, r.left)}px round ${round}px)`;
  };

  function updateArt() {
    const u = faces(current)[face];
    if (!u || !u.art_crop) {
      msg('Artwork non disponibile per questa carta.');
      return false;
    }
    if (artImg.getAttribute('src') !== u.art_crop) {
      artImg.src = u.art_crop;
      artBg.style.backgroundImage = `url("${u.art_crop}")`;
      if (!reduceMotion && !art.hidden) artImg.animate([{ opacity: .35 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
    }
    artImg.alt = current.name || '';
    return true;
  }

  const faceArt = (card, f) => { const fs = faces(card); const u = fs[f] || fs[0]; return u ? u.art_crop : ''; };
  const faceArtist = (card, f) => (card.card_faces && card.card_faces[f] && card.card_faces[f].artist) || card.artist || '';
  const faceIllus = (card, f) => (card.card_faces && card.card_faces[f] && card.card_faces[f].illustration_id) || card.illustration_id || '';

  async function loadVariants(card, f) {
    const my = ++variantsToken;
    const oid = card.oracle_id || (card.card_faces && card.card_faces[0] && card.card_faces[0].oracle_id);
    const q = oid ? 'oracleid:' + oid : '!"' + (card.name || '').replace(/"/g, '') + '"';
    let vs = [];
    try {
      const data = await sf('/cards/search?' + new URLSearchParams({ q, unique: 'art', order: 'released', dir: 'asc' }));
      vs = (data.data || []).filter((v) => faceArt(v, f));
    } catch (_) { vs = []; }
    if (my !== variantsToken) return;
    const artists = new Set(vs.map((v) => faceArtist(v, f)).filter(Boolean));
    if (vs.length < 2 || artists.size < 2) { hideVariants(); return; }
    renderVariants(vs, f, artists.size);
  }

  function hideVariants() {
    varState = null;
    varPanel.hidden = true;
    document.body.classList.remove('has-variants');
  }

  function renderVariants(vs, f, nArtists) {
    varState = { vs, f };
    const curIllus = faceIllus(current, face);
    varTitle.textContent = `${vs.length} versioni · ${nArtists} artisti`;
    varList.textContent = '';
    const frag = document.createDocumentFragment();
    let curBtn = null;
    vs.forEach((v) => {
      const b = document.createElement('button');
      b.type = 'button';
      const artist = faceArtist(v, f) || 'Artista sconosciuto';
      b.title = `${artist} · ${v.set_name || ''}`;
      const isCur = (curIllus && faceIllus(v, f) === curIllus) || v.id === current.id;
      if (isCur) { b.setAttribute('aria-current', 'true'); curBtn = b; }
      const im = document.createElement('img');
      im.src = faceArt(v, f); im.alt = ''; im.loading = 'lazy';
      const name = document.createElement('span'); name.textContent = artist;
      const set = document.createElement('small'); set.textContent = (v.set || '') + (v.released_at ? ' · ' + v.released_at.slice(0, 4) : '');
      const txt = document.createElement('div'); txt.className = 'txt';
      txt.append(name, set);
      b.append(im, txt);
      b.addEventListener('click', (e) => { e.stopPropagation(); pickVariant(v, f); });
      frag.appendChild(b);
    });
    varList.appendChild(frag);
    varPanel.hidden = false;
    document.body.classList.add('has-variants');
    if (curBtn) curBtn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function stepVariant(d) {
    if (!varState || varPanel.hidden) return false;
    const { vs, f } = varState;
    const cur = faceIllus(current, face);
    let i = vs.findIndex((v) => v.id === current.id);
    if (i < 0) i = vs.findIndex((v) => cur && faceIllus(v, f) === cur);
    const next = vs[((i < 0 ? 0 : i + d) + vs.length) % vs.length];
    pickVariant(next, f, d > 0 ? 'down' : 'up');
    return true;
  }

  async function pickVariant(v, f, mode = 'fade') {
    if (v.id === current.id) return;
    if (list.length) list[index] = v; else { list = [v]; index = 0; }
    current = v; face = Math.min(f, Math.max(0, faces(v).length - 1));
    document.title = (v.name ? v.name + ' — ' : '') + 'Vetrina · Magic';
    btn.setAttribute('aria-label', v.name || 'Carta');
    img.alt = v.name || '';
    flipBtn.hidden = faces(v).length < 2;
    try { history.replaceState(null, '', '#' + v.id); } catch (_) {}
    preload(v);
    loadVariants(v, face);
    if (artOpen) updateArt();
    await setFace(mode);
  }

  varPanel.addEventListener('click', (e) => e.stopPropagation());

  function openArt() {
    if (!current || artOpen) return;
    artOpen = true; closing = false;
    if (!updateArt()) { artOpen = false; return; }
    const r = img.getBoundingClientRect();
    art.hidden = false;
    if (!reduceMotion) {
      art.animate(
        [{ clipPath: inset(r, r.width * 0.0475) }, { clipPath: 'inset(0px 0px 0px 0px round 0px)' }],
        { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' }
      );
    }
    if (art.requestFullscreen) art.requestFullscreen().catch(() => {});
  }

  function closeArt() {
    if (!artOpen || closing) return;
    closing = true;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    const finish = () => { art.hidden = true; artOpen = false; closing = false; };
    if (reduceMotion) return finish();
    const r = img.getBoundingClientRect();
    const a = art.animate(
      [{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: inset(r, r.width * 0.0475) }],
      { duration: 360, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }
    );
    a.onfinish = () => { finish(); a.cancel(); };
  }

  btn.addEventListener('click', openArt);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) openArt(); });
  art.addEventListener('click', closeArt);
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && artOpen) closeArt(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (artOpen) { e.preventDefault(); closeArt(); }
      else if (!search.hidden) closeSearch();
      return;
    }
    const typing = e.target instanceof HTMLElement && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSearch(); return; }
    if (artOpen) {
      if (e.key === 'ArrowRight') { e.preventDefault(); nav(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); nav(-1); }
      else if (e.key === 'ArrowDown') { if (stepVariant(1)) e.preventDefault(); }
      else if (e.key === 'ArrowUp') { if (stepVariant(-1)) e.preventDefault(); }
      else if (e.key === 'f' || e.key === 'F') flip();
      return;
    }
    if (typing || !search.hidden) return;
    if (e.key === '/') { e.preventDefault(); openSearch(); }
    else if (e.key === 'ArrowRight') nav(1);
    else if (e.key === 'ArrowLeft') nav(-1);
    else if (e.key === 'ArrowDown') { if (stepVariant(1)) e.preventDefault(); }
    else if (e.key === 'ArrowUp') { if (stepVariant(-1)) e.preventDefault(); }
    else if (e.key === 'f' || e.key === 'F') flip();
    else if (e.key === 'r' || e.key === 'R') loadRandom();
    else if (e.key === 'Backspace' && results.length) { e.preventDefault(); openSearch(); }
  });

  if (fine && !reduceMotion) {
    const stage = $('#stage');
    stage.addEventListener('pointermove', (e) => {
      const r = wrap.getBoundingClientRect();
      const x = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
      const y = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      const cl = (v) => Math.max(-1, Math.min(1, v));
      wrap.style.setProperty('--ry', (cl(x) * 7).toFixed(2) + 'deg');
      wrap.style.setProperty('--rx', (cl(y) * -7).toFixed(2) + 'deg');
      wrap.style.setProperty('--gx', (50 - cl(x) * 48).toFixed(1) + '%');
      wrap.style.setProperty('--gy', (50 - cl(y) * 48).toFixed(1) + '%');
      const near = Math.max(Math.abs(x), Math.abs(y)) < 1.6;
      wrap.style.setProperty('--go', near ? '1' : '0');
    });
    stage.addEventListener('pointerleave', () => {
      wrap.style.setProperty('--ry', '0deg'); wrap.style.setProperty('--rx', '0deg');
      wrap.style.setProperty('--go', '0');
    });
  }

  let touchX = null;
  document.addEventListener('touchstart', (e) => {
    const onStrip = e.target instanceof Node && varPanel.contains(e.target);
    touchX = e.touches.length === 1 && !onStrip ? e.touches[0].clientX : null;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (touchX === null || !search.hidden) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 70) nav(dx < 0 ? 1 : -1);
    touchX = null;
  }, { passive: true });

  const hashId = location.hash.slice(1);
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(hashId)) loadById(hashId);
  else loadRandom();
})();
</script>
</body>
</html>
